<style>
        /* Custom Geist Font Fallback */
        @font-face {
            font-family: 'Geist';
            src: local('System-ui'), local('-apple-system'), local('BlinkMacSystemFont'), local('Segoe UI'), local('Roboto'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
        }
        
        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Abstract Glow Background */
        .bg-glow-abstract {
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.1) 25%, transparent 60%);
        }

        /* Input Focus Glow */
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
            border-color: #FFFFFF;
        }
        
        /* Gradient CTA */
        .bg-cta-gradient {
            background: linear-gradient(135deg, #e5e2e1 0%, #c9c6c5 100%);
            color: #0A0A0A;
        }
        .bg-cta-gradient:hover {
            box-shadow: 0 0 20px rgba(229, 226, 225, 0.3);
        }

        /* Feature Card Gradient Border */
        .feature-border-top {
            position: relative;
        }
        .feature-border-top::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-grid-pattern aspect-video w-full max-w-[1920px] mx-auto">
<!-- Ambient Glow Background -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="w-[800px] h-[800px] bg-glow-abstract rounded-full mix-blend-screen opacity-70"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[440px] px-sm flex flex-col items-center">
<!-- Prominent Logo -->
<div class="flex items-center justify-center gap-xs mb-lg">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
<h1 class="font-display-lg text-display-lg tracking-tighter font-bold">Adverto</h1>
</div>
<!-- Auth Card -->
<div class="relative w-full">
<div class="absolute -inset-[2px] rounded-xl bg-gradient-to-r from-[#3b82f6] to-[#8b5cf6] z-[-1] opacity-75 blur-[1px]"></div>
<div class="bg-surface-container-low/80 backdrop-blur-xl border border-outline-variant/30 rounded-xl shadow-[0_0_40px_rgba(0,0,0,0.5)] feature-border-top overflow-hidden">
<div class="p-margin">
<!-- Header -->
<div class="text-center mb-md">
<p class="font-body-md text-body-md text-on-surface-variant">We'll email you a secure link to sign in instantly.</p>
</div>
<!-- Form -->
<form class="space-y-sm">
<div>
<label class="sr-only" for="email">Email Address</label>
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-lg px-md py-sm font-label-sm text-label-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none input-glow transition-all duration-300" id="email" placeholder="name@company.com" type="email"/>
</div>
<button class="w-full bg-cta-gradient rounded-lg py-sm px-md font-label-sm text-label-sm uppercase tracking-widest font-bold mt-md transition-all duration-300 flex items-center justify-center gap-xs" type="submit">
                        Send Magic Link <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Links -->
<div class="bg-surface-container-lowest/50 backdrop-blur-sm border-t border-outline-variant/30 p-md flex items-center justify-center">
<a class="font-label-sm text-label-sm uppercase text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-base" href="#">
<span class="material-symbols-outlined text-[14px]">arrow_back</span>
                    Back to Home
                </a>
</div>
